name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # 真实 LLM 评测需要手动触发（默认不跑，零额度）
  workflow_dispatch:
    inputs:
      run_live_eval:
        description: '是否运行真实 LLM 评测（需要 VITE_DEEPSEEK_API_KEY）'
        type: boolean
        default: false

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: 单元测试 + AI 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  build:
    name: 生产构建
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E 测试
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: 上传 E2E 截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/

  # eval job：只跑「确定性检查 + 报告生成」，不重复跑测试（职责切分见实施计划 T-3）
  # 门禁阶段：**A 观察** —— 所有检查都跑完、失败只告警不阻断（连续 3 次绿后才按 §1.4 收紧到 C 阻断）。
  # 「只告警」是靠 continue-on-error: true 实现的：不写它的话，任一失败会中止 job 并跳过后续 step，
  # 观察期要求的「全量检查 + 汇总」就不成立（评审 MINOR-6）。
  eval:
    name: 评测门禁（观察阶段）
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci

      - name: 基准集与题库一致性
        continue-on-error: true
        run: npm run golden:check

      - name: 向量产物一致性
        continue-on-error: true
        run: npm run vectors:build -- --check

      - name: 阈值仍接近最优
        continue-on-error: true
        run: npm run threshold:tune -- --check

      # golden-eval.json 与 rag-metrics.json 是测试的副作用产物，
      # 写在 test job 自己的工作区里，本 job 必须自己再跑一遍，
      # 否则生成的报告会缺掉「基准集跑批」与「检索指标」两块（评审 MAJOR-4）。
      - name: 基准集跑批（零额度，只跑 runGoldenEval，避免与下一步重复）
        continue-on-error: true
        run: npm run eval:golden

      - name: 检索与忠实度指标（零额度）
        continue-on-error: true
        run: npm run eval:rag

      - name: 生成评测报告
        if: always()
        run: npm run eval:report

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: test-results/

  # 真实 LLM 评测：只在手动触发且 Key 存在时运行，否则天然 skipped
  live-eval:
    name: 真实 LLM 评测（手动）
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_eval == true && secrets.VITE_DEEPSEEK_API_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: 运行真实接口测试
        env:
          LLM_E2E: '1'
          VITE_DEEPSEEK_API_KEY: ${{ secrets.VITE_DEEPSEEK_API_KEY }}
        run: npm run test:api
