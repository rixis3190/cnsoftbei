name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # 真实 LLM 评测需要手动触发（默认不跑，零额度）
  workflow_dispatch:
    inputs:
      run_live_eval:
        description: '是否运行真实 LLM 评测（需要 VITE_DEEPSEEK_API_KEY）'
        type: boolean
        default: false

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: 单元测试 + AI 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
      # 覆盖率报告此前未上传：ratchet 门槛失败时看不到是哪块代码掉下来了（计划 §9.5 R9）
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  build:
    name: 生产构建
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E 测试
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: 上传 E2E 截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/

  # eval job：只跑「确定性检查 + 报告生成」，不重复跑测试（职责切分见实施计划 T-3）
  # 门禁阶段：**A 观察** —— 所有检查都跑完、失败只告警不阻断（连续 3 次绿后才按 §1.4 收紧到 C 阻断）。
  # 「只告警」是靠 continue-on-error: true 实现的：不写它的话，任一失败会中止 job 并跳过后续 step，
  # 观察期要求的「全量检查 + 汇总」就不成立（评审 MINOR-6）。
  eval:
    name: 评测门禁（观察阶段）
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci

      - name: 基准集与题库一致性
        continue-on-error: true
        run: npm run golden:check

      - name: 向量产物一致性
        continue-on-error: true
        run: npm run vectors:build -- --check

      # --check 自身始终退出 0（漂移只告警，见计划 T3-R2）；
      # continue-on-error 是为了兜住「脚本硬错误」（如索引不可用）时的观察期语义
      - name: 阈值仍接近最优
        continue-on-error: true
        run: npm run threshold:tune -- --check

      # golden-eval.json 与 rag-metrics.json 是测试的副作用产物，
      # 写在 test job 自己的工作区里，本 job 必须自己再跑一遍，
      # 否则生成的报告会缺掉「基准集跑批」与「检索指标」两块（评审 MAJOR-4）。
      - name: 基准集跑批（零额度，只跑 runGoldenEval，避免与下一步重复）
        continue-on-error: true
        run: npm run eval:golden

      - name: 检索与忠实度指标（零额度）
        continue-on-error: true
        run: npm run eval:rag

      - name: 生成评测报告
        if: always()
        run: npm run eval:report

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: test-results/

  # 真实 LLM 评测：只在手动触发且 Key 存在时运行，否则整 job 的所有 step 被跳过
  #
  # ⚠️ 血泪教训（2026-10-08 CI run #2 实测）：**`secrets` 不能出现在 `if:` 里**。
  # GitHub 的上下文可用性规则（Contexts → Context availability）：
  #   jobs.<job_id>.if     → 仅 github / needs / vars / inputs（**无 secrets**）
  #   jobs.<job_id>.steps.if → 仅 … env / steps / inputs 等（**同样无 secrets**）
  #   secrets 只在 `jobs.<job_id>.env` 与 `steps[*].env` 等**赋值位置**可用
  # 之前写成 job 级 `if: … && secrets.VITE_DEEPSEEK_API_KEY != ''`，
  # 属于工作流解析错误 —— 后果不是「这个 job 被跳过」，而是
  # **整个 workflow 以 0 个 job 立即失败**（CI 全红且看不到任何日志）。
  # 正确写法：secret 在 job 级 env 求值，再由 step 级 if 读 env（step 级 if 支持 env 上下文）。
  live-eval:
    name: 真实 LLM 评测（手动）
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_eval == true
    env:
      HAS_LLM_KEY: ${{ secrets.VITE_DEEPSEEK_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_LLM_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_LLM_KEY == 'true'
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
        if: env.HAS_LLM_KEY == 'true'
      - name: 运行真实接口测试
        if: env.HAS_LLM_KEY == 'true'
        env:
          LLM_E2E: '1'
          VITE_DEEPSEEK_API_KEY: ${{ secrets.VITE_DEEPSEEK_API_KEY }}
        run: npm run test:api
